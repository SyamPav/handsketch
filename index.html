      if (interactionMode === 'moveShape' && selectedShape && initialShapeSnapshot) {
        const dx = pt.x - dragStartMouse.x;
        const dy = pt.y - dragStartMouse.y;

        if (initialShapeSnapshot.points) {
          selectedShape.points = initialShapeSnapshot.points.map(p => ({ x: p.x + dx, y: p.y + dy }));
        }
        if (initialShapeSnapshot.innerPoints) {
          selectedShape.innerPoints = initialShapeSnapshot.innerPoints.map(p => ({ x: p.x + dx, y: p.y + dy }));
        }
        if (selectedShape.type !== 'dimension' && initialShapeSnapshot.p1 && initialShapeSnapshot.p2) {
          selectedShape.p1 = { x: initialShapeSnapshot.p1.x + dx, y: initialShapeSnapshot.p1.y + dy };
          selectedShape.p2 = { x: initialShapeSnapshot.p2.x + dx, y: initialShapeSnapshot.p2.y + dy };
        }
        if (initialShapeSnapshot.standoff) {
          selectedShape.standoff = { x: initialShapeSnapshot.standoff.x + dx, y: initialShapeSnapshot.standoff.y + dy };
        }
        render();
        return;
      }

      // Handle Moving Endpoints of Lines/Arrows
      if (interactionMode === 'moveEndpoint' && selectedShape) {
        if (activeHandle === 'p1') selectedShape.p1 = pt;
        if (activeHandle === 'p2') selectedShape.p2 = pt;
        render();
        return;
      }

      // Handle Moving Individual Vertices (Edit Points mode)
      if (interactionMode === 'moveVertex' && selectedShape && selectedShape.points) {
        selectedShape.points[activeHandle] = pt;
        if (selectedShape.isSolid) {
          selectedShape.innerPoints = computeOffsetPolyline(selectedShape.points, sheetThickness);
        }
        render();
        return;
      }

      // Handle Resizing with 8 Bounding Box Handles
      if (interactionMode === 'resizeHandle' && selectedShape && initialShapeSnapshot) {
        const initB = getShapeBounds(initialShapeSnapshot);
        if (!initB || initB.width === 0 || initB.height === 0) return;

        let scaleX = 1, scaleY = 1;
        let originX = initB.x, originY = initB.y;

        if (activeHandle === 'se') {
          scaleX = (pt.x - initB.x) / initB.width;
          scaleY = (pt.y - initB.y) / initB.height;
          originX = initB.x; originY = initB.y;
        } else if (activeHandle === 'nw') {
          scaleX = (initB.maxX - pt.x) / initB.width;
          scaleY = (initB.maxY - pt.y) / initB.height;
          originX = initB.maxX; originY = initB.maxY;
        } else if (activeHandle === 'ne') {
          scaleX = (pt.x - initB.x) / initB.width;
          scaleY = (initB.maxY - pt.y) / initB.height;
          originX = initB.x; originY = initB.maxY;
        } else if (activeHandle === 'sw') {
          scaleX = (initB.maxX - pt.x) / initB.width;
          scaleY = (pt.y - initB.y) / initB.height;
          originX = initB.maxX; originY = initB.y;
        } else if (activeHandle === 'e') {
          scaleX = (pt.x - initB.x) / initB.width;
          originX = initB.x; originY = initB.y;
        } else if (activeHandle === 'w') {
          scaleX = (initB.maxX - pt.x) / initB.width;
          originX = initB.maxX; originY = initB.y;
        } else if (activeHandle === 's') {
          scaleY = (pt.y - initB.y) / initB.height;
          originX = initB.x; originY = initB.y;
        } else if (activeHandle === 'n') {
          scaleY = (initB.maxY - pt.y) / initB.height;
          originX = initB.x; originY = initB.maxY;
        }

        if (Math.abs(scaleX) < 0.05) scaleX = 0.05;
        if (Math.abs(scaleY) < 0.05) scaleY = 0.05;

        // Transform all points proportionally
        if (initialShapeSnapshot.points) {
          selectedShape.points = initialShapeSnapshot.points.map(p => ({
            x: originX + (p.x - originX) * scaleX,
            y: originY + (p.y - originY) * scaleY
          }));
        }
        if (initialShapeSnapshot.innerPoints) {
          selectedShape.innerPoints = initialShapeSnapshot.innerPoints.map(p => ({
            x: originX + (p.x - originX) * scaleX,
            y: originY + (p.y - originY) * scaleY
          }));
        }
        if (initialShapeSnapshot.p1 && initialShapeSnapshot.p2) {
          selectedShape.p1 = {
            x: originX + (initialShapeSnapshot.p1.x - originX) * scaleX,
            y: originY + (initialShapeSnapshot.p1.y - originY) * scaleY
          };
          selectedShape.p2 = {
            x: originX + (initialShapeSnapshot.p2.x - originX) * scaleX,
            y: originY + (initialShapeSnapshot.p2.y - originY) * scaleY
          };
        }
        render();
        return;
      }

      // Drawing interaction
      if (interactionMode === 'draw') {
        if (currentTool === 'autosnap' || currentTool === 'smooth') {
          currentPoints.push(pt);
        }
        render();
      }
    });

    canvas.addEventListener('mouseup', () => {
      if (currentTool === 'dimension' && interactionMode === 'dimDrag') {
        const snap = currentSnapCandidate ? { x: currentSnapCandidate.x, y: currentSnapCandidate.y } : mousePos;
        if (dimP1 && dist(dimP1, snap) > 8) {
          createAutoDimension(dimP1, snap);
        } else {
          isInteracting = false;
          interactionMode = null;
          render();
        }
        return;
      }

      if (!isInteracting) return;
      isInteracting = false;

      if (interactionMode === 'draw') {
        recordState();
        if (currentTool === 'line' && startPoint) {
          const endP = orthoSnap ? snapPointOrtho(startPoint, mousePos) : mousePos;
          if (dist(startPoint, endP) > 5) {
            const s = { id: Date.now(), type: 'line', p1: startPoint, p2: endP, color: activeColor, thickness: strokeThickness };
            shapes.push(s);
            selectedShape = s;
          }
          startPoint = null;
        } else if (currentTool === 'arrow' && startPoint) {
          const endP = orthoSnap ? snapPointOrtho(startPoint, mousePos) : mousePos;
          if (dist(startPoint, endP) > 5) {
            const s = { id: Date.now(), type: 'arrow', p1: startPoint, p2: endP, color: activeColor, thickness: strokeThickness };
            shapes.push(s);
            selectedShape = s;
          }
          startPoint = null;
        } else if (currentTool === 'triangle' && startPoint) {
          const endP = orthoSnap ? snapPointOrtho(startPoint, mousePos) : mousePos;
          if (dist(startPoint, endP) > 5) {
            const s = { id: Date.now(), type: 'triangle', p1: startPoint, p2: endP, color: activeColor, thickness: strokeThickness, filled: triangleFilled };
            shapes.push(s);
            selectedShape = s;
          }
          startPoint = null;
        } else if (currentTool === 'autosnap' && currentPoints.length > 2) {
          const recognizedPoints = recognizeAndSnapProfile(currentPoints);
          const s = { id: Date.now(), type: 'polyline', points: recognizedPoints, color: activeColor, thickness: strokeThickness, filletRadius: filletRadius };
          shapes.push(s);
          selectedShape = s;
          currentPoints = [];
        } else if (currentTool === 'smooth' && currentPoints.length > 2) {
          const smoothed = smoothRawPoints(currentPoints);
          const s = { id: Date.now(), type: 'smooth', points: smoothed, color: activeColor, thickness: strokeThickness };
          shapes.push(s);
          selectedShape = s;
          currentPoints = [];
        }
      }

      interactionMode = null;
      activeHandle = null;
      initialShapeSnapshot = null;
      render();
    });

    // Update Floating Menu
    function updateFloatingMenu() {
      if (!selectedShape || (currentTool !== 'select' && currentTool !== 'dimension')) {
        floatingMenu.style.display = 'none';
        return;
      }

      const b = getShapeBounds(selectedShape);
      if (!b) { floatingMenu.style.display = 'none'; return; }

      floatingMenu.style.display = 'flex';
      floatingMenu.style.left = `${Math.min(window.innerWidth - 320, Math.max(20, b.x + b.width / 2 - 120))}px`;
      floatingMenu.style.top = `${Math.max(60, b.y - 42)}px`;

      document.getElementById('fBtnEditPoints').style.display = (selectedShape.points && selectedShape.points.length > 0) ? 'inline-block' : 'none';
      document.getElementById('fBtnEditPoints').innerText = editPointsMode ? '✔ Done Points' : '📍 Edit Points';

      const flipBtn = document.getElementById('fBtnFlipDimArrows');
      const dimModeBtn = document.getElementById('fBtnDimMode');
      if (selectedShape.type === 'dimension') {
        flipBtn.style.display = 'inline-block';
        const isCurInward = selectedShape.arrowDir === 'inward';
        flipBtn.innerText = isCurInward ? '🏹 Arrows: Inward' : '🏹 Arrows: Outward';

        dimModeBtn.style.display = 'inline-block';
        const curType = selectedShape.dimType || 'aligned';
        dimModeBtn.innerText = `📐 ${curType.toUpperCase()} (Cycle)`;
      } else {
        flipBtn.style.display = 'none';
        dimModeBtn.style.display = 'none';
      }
    }

    // Floating Menu Handlers
    document.getElementById('fBtnEditPoints').onclick = () => {
      editPointsMode = !editPointsMode;
      render();
    };

    document.getElementById('fBtnDimMode').onclick = () => {
      if (!selectedShape || selectedShape.type !== 'dimension') return;
      recordState();
      const types = ['aligned', 'horizontal', 'vertical'];
      const nextIdx = (types.indexOf(selectedShape.dimType || 'aligned') + 1) % types.length;
      selectedShape.dimType = types[nextIdx];
      dimType = selectedShape.dimType;
      document.getElementById('dimTypeSelect').value = selectedShape.dimType;
      updateFloatingMenu();
      render();
    };

    document.getElementById('fBtnFlipDimArrows').onclick = () => {
      if (!selectedShape || selectedShape.type !== 'dimension') return;
      recordState();
      selectedShape.arrowDir = (selectedShape.arrowDir === 'inward') ? 'outward' : 'inward';
      dimArrowDir = selectedShape.arrowDir;
      document.getElementById('dimArrowDir').value = dimArrowDir;
      updateFloatingMenu();
      render();
    };

    document.getElementById('fBtnDuplicate').onclick = duplicateSelectedShape;
    document.getElementById('btnDuplicate').onclick = duplicateSelectedShape;

    document.getElementById('fBtnDelete').onclick = () => {
      if (!selectedShape) return;
      recordState();
      shapes = shapes.filter(s => s.id !== selectedShape.id);
      selectedShape = null;
      render();
    };

    // --- Toolbar Handlers ---
    function setActiveTool(tool) {
      currentTool = tool;
      document.querySelectorAll('.toolbar-group .btn').forEach(b => b.classList.remove('active'));
      dimStep = 0; dimP1 = null; dimP2 = null;

      if (tool === 'select') {
        document.getElementById('toolSelect').classList.add('active');
        statusHint.innerHTML = "👆 <b>Select & Move Mode:</b> Click any shape to drag/move, resize via 8 handles, or edit individual vertices.";
      } else if (tool === 'autosnap') {
        document.getElementById('toolAutoSnap').classList.add('active');
        statusHint.innerHTML = "⚡ <b>Auto-Snap:</b> Draw rapidly. Snaps to clean CAD flanges and bend radii.";
      } else if (tool === 'smooth') {
        document.getElementById('toolSmooth').classList.add('active');
        statusHint.innerHTML = "〰️ <b>Smooth Curve:</b> Freehand jitter-stabilized sketch.";
      } else if (tool === 'line') {
        document.getElementById('toolLine').classList.add('active');
        statusHint.innerHTML = "📏 <b>Line Tool:</b> Drag to draw straight lines (snaps 0°/90°/45°).";
      } else if (tool === 'arrow') {
        document.getElementById('toolArrow').classList.add('active');
        statusHint.innerHTML = "➡️ <b>Arrow Tool:</b> Drag to draw engineering datum and callout arrows.";
      } else if (tool === 'triangle') {
        document.getElementById('toolTriangle').classList.add('active');
        statusHint.innerHTML = "🔺 <b>Triangle Tool:</b> Drag to place datum triangles and alignment markers.";
      } else if (tool === 'dimension') {
        document.getElementById('toolDim').classList.add('active');
        dimStep = 0; dimP1 = null; dimP2 = null;
        statusHint.innerHTML = "📐 <b>CAD Dimension:</b> Snap between 2 points (vertices, edges, or ⟂) to auto-create presentation lines & arrows. (Press Esc to cancel)";
      }
      render();
    }

    document.getElementById('toolSelect').onclick = () => setActiveTool('select');
    document.getElementById('toolAutoSnap').onclick = () => setActiveTool('autosnap');
    document.getElementById('toolSmooth').onclick = () => setActiveTool('smooth');
    document.getElementById('toolLine').onclick = () => setActiveTool('line');
    document.getElementById('toolArrow').onclick = () => setActiveTool('arrow');
    document.getElementById('toolTriangle').onclick = () => setActiveTool('triangle');
    document.getElementById('toolDim').onclick = () => setActiveTool('dimension');

    document.getElementById('btnUndo').onclick = undo;
    document.getElementById('btnRedo').onclick = redo;

    document.getElementById('btnClear').onclick = () => {
      if (shapes.length === 0) return;
      if (confirm('Clear the entire canvas?')) {
        recordState();
        shapes = [];
        selectedShape = null;
        render();
      }
    };

    document.getElementById('dimTypeSelect').onchange = (e) => {
      dimType = e.target.value;
      if (selectedShape && selectedShape.type === 'dimension') {
        recordState();
        if (dimType === 'auto') {
          const dx = Math.abs(selectedShape.p2.x - selectedShape.p1.x);
          const dy = Math.abs(selectedShape.p2.y - selectedShape.p1.y);
          selectedShape.dimType = (dy < 6) ? 'horizontal' : (dx < 6 ? 'vertical' : 'aligned');
        } else {
          selectedShape.dimType = dimType;
        }
        render();
        updateFloatingMenu();
      }
    };
    document.getElementById('dimArrowDir').onchange = (e) => {
      dimArrowDir = e.target.value;
      if (selectedShape && selectedShape.type === 'dimension') {
        recordState();
        selectedShape.arrowDir = dimArrowDir;
        render();
      }
    };
    document.getElementById('dimLineThick').onchange = (e) => {
      dimLineWidth = parseFloat(e.target.value) || 2.5;
      if (selectedShape && selectedShape.type === 'dimension') {
        recordState();
        selectedShape.lineWidth = dimLineWidth;
        render();
      }
    };
    document.getElementById('dimStubThick').onchange = (e) => {
      dimStubWidth = e.target.value;
      const val = (dimStubWidth === 'auto') ? strokeThickness : (parseFloat(dimStubWidth) || 4);
      if (selectedShape && selectedShape.type === 'dimension') {
        recordState();
        selectedShape.stubThickness = val;
        render();
      }
    };
    document.getElementById('dimScale').oninput = (e) => {
      dimScale = Math.max(1, parseFloat(e.target.value) || 10);
      if (selectedShape && selectedShape.type === 'dimension') {
        recordState();
        selectedShape.scale = dimScale;
        render();
      }
    };

    document.getElementById('orthoSnap').onchange = (e) => { orthoSnap = e.target.checked; };
    document.getElementById('showGrid').onchange = (e) => { showGrid = e.target.checked; render(); };
    document.getElementById('triangleFilled').onchange = (e) => {
      triangleFilled = e.target.checked;
      if (selectedShape && selectedShape.type === 'triangle') {
        recordState();
        selectedShape.filled = triangleFilled;
        render();
      }
    };

    // Keyboard Shortcuts (Esc cancels/exits, Arrow keys nudge, Ctrl+D duplicate, Ctrl+Z undo)
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        e.preventDefault();
        if (e.target && typeof e.target.blur === 'function') e.target.blur();
        isInteracting = false;
        interactionMode = null;
        activeHandle = null;
        startPoint = null;
        currentPoints = [];
        dimStep = 0;
        dimP1 = null;
        dimP2 = null;
        currentSnapCandidate = null;
        editPointsMode = false;
        selectedShape = null;
        if (floatingMenu) floatingMenu.style.display = 'none';
        setActiveTool('select');
        statusHint.innerHTML = "👆 <b>Select Mode:</b> Click any shape to select, or pick a tool above.";
        render();
        return;
      }
      if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
        e.preventDefault(); undo();
      } else if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.shiftKey && e.key === 'Z'))) {
        e.preventDefault(); redo();
      } else if ((e.ctrlKey || e.metaKey) && e.key === 'd') {
        e.preventDefault(); duplicateSelectedShape();
      } else if (e.key === 'v' || e.key === 'V') {
        setActiveTool('select');
      } else if (e.key === 'Delete' || e.key === 'Backspace') {
        if (selectedShape) {
          recordState();
          shapes = shapes.filter(s => s.id !== selectedShape.id);
          selectedShape = null;
          render();
        }
      } else if (selectedShape && ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
        e.preventDefault();
        const step = e.shiftKey ? 10 : 2;
        let dx = 0, dy = 0;
        if (e.key === 'ArrowUp') dy = -step;
        if (e.key === 'ArrowDown') dy = step;
        if (e.key === 'ArrowLeft') dx = -step;
        if (e.key === 'ArrowRight') dx = step;

        recordState();
        if (selectedShape.type === 'dimension') {
          if (selectedShape.standoff) {
            selectedShape.standoff.x += dx;
            selectedShape.standoff.y += dy;
          }
          render();
          return;
        }
        if (selectedShape.points) selectedShape.points.forEach(p => { p.x += dx; p.y += dy; });
        if (selectedShape.innerPoints) selectedShape.innerPoints.forEach(p => { p.x += dx; p.y += dy; });
        if (selectedShape.p1 && selectedShape.p2) {
          selectedShape.p1.x += dx; selectedShape.p1.y += dy;
          selectedShape.p2.x += dx; selectedShape.p2.y += dy;
        }
        render();
      }
    });

    // --- Vector SVG & High-Res PNG Export ---
    document.getElementById('btnExportPNG').onclick = () => {
      const link = document.createElement('a');
      link.download = `gap_flush_presentation_${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    };

    document.getElementById('btnExportSVG').onclick = () => {
      const dpr = window.devicePixelRatio || 1;
      const w = canvas.width / dpr;
      const h = canvas.height / dpr;

      let svgContent = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">\n`;
      svgContent += `  <rect width="100%" height="100%" fill="#131317" />\n`;

      shapes.forEach(shape => {
        const th = shape.thickness || 4;
        if (shape.isSolid && shape.innerPoints) {
          let pathD = shape.points.map((p, idx) => `${idx === 0 ? 'M' : 'L'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');
          pathD += ` ` + [...shape.innerPoints].reverse().map(p => `L ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ') + ` Z`;
          svgContent += `  <path d="${pathD}" fill="${shape.color}" fill-opacity="0.25" stroke="${shape.color}" stroke-width="2" />\n`;
        } else if (shape.type === 'line') {
          svgContent += `  <line x1="${shape.p1.x}" y1="${shape.p1.y}" x2="${shape.p2.x}" y2="${shape.p2.y}" stroke="${shape.color}" stroke-width="${th}" stroke-linecap="round" />\n`;
        } else if (shape.type === 'arrow') {
          const dx = shape.p2.x - shape.p1.x;
          const dy = shape.p2.y - shape.p1.y;
          const angle = Math.atan2(dy, dx);
          const headLen = Math.max(12, th * 3.5);
          svgContent += `  <line x1="${shape.p1.x}" y1="${shape.p1.y}" x2="${shape.p2.x}" y2="${shape.p2.y}" stroke="${shape.color}" stroke-width="${th}" stroke-linecap="round" />\n`;
          const a1x = shape.p2.x - headLen * Math.cos(angle - Math.PI / 7);
          const a1y = shape.p2.y - headLen * Math.sin(angle - Math.PI / 7);
          const a2x = shape.p2.x - headLen * Math.cos(angle + Math.PI / 7);
          const a2y = shape.p2.y - headLen * Math.sin(angle + Math.PI / 7);
          svgContent += `  <polygon points="${shape.p2.x},${shape.p2.y} ${a1x},${a1y} ${a2x},${a2y}" fill="${shape.color}" />\n`;
        } else if (shape.type === 'triangle') {
          const dx = shape.p2.x - shape.p1.x;
          const dy = shape.p2.y - shape.p1.y;
          const side = Math.hypot(dx, dy);
          const angle = Math.atan2(dy, dx);
          const baseHalf = side * 0.577;
          const perpAngle = angle + Math.PI / 2;
          const b1x = shape.p1.x + baseHalf * Math.cos(perpAngle);
          const b1y = shape.p1.y + baseHalf * Math.sin(perpAngle);
          const b2x = shape.p1.x - baseHalf * Math.cos(perpAngle);
          const b2y = shape.p1.y - baseHalf * Math.sin(perpAngle);
          const fillAttr = shape.filled ? `fill="${shape.color}"` : `fill="none"`;
          svgContent += `  <polygon points="${shape.p2.x},${shape.p2.y} ${b1x},${b1y} ${b2x},${b2y}" ${fillAttr} stroke="${shape.color}" stroke-width="${th}" />\n`;
        } else if (shape.points && shape.points.length > 1) {
          const pathD = shape.points.map((p, idx) => `${idx === 0 ? 'M' : 'L'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');
          svgContent += `  <path d="${pathD}" fill="none" stroke="${shape.color}" stroke-width="${th}" stroke-linecap="round" stroke-linejoin="round" />\n`;
        } else if (shape.type === 'dimension') {
          const p1 = shape.p1, p2 = shape.p2;
          const standoff = shape.standoff || p2;
          const type = getEffectiveDimType(shape, standoff);
          const arrowDir = shape.arrowDir || 'auto';
          const scale = shape.scale || 10;
          const color = shape.color || '#10b981';

          if (type === 'aligned') {
            const dx = p2.x - p1.x, dy = p2.y - p1.y;
            const L = Math.hypot(dx, dy);
            if (L > 1) {
              const ux = dx / L, uy = dy / L;
              const nx = -uy, ny = ux;
              let h = (standoff.x - p1.x) * nx + (standoff.y - p1.y) * ny;
              if (Math.abs(h) < 12) h = h >= 0 ? 25 : -25;
              const D1 = { x: p1.x + h * nx, y: p1.y + h * ny };
              const D2 = { x: p2.x + h * nx, y: p2.y + h * ny };
              const sgn = Math.sign(h) || 1;
              const theta = Math.atan2(dy, dx);
              const isOutward = (arrowDir === 'outward' || (arrowDir === 'auto' && L >= 48));

              svgContent += `  <line x1="${p1.x + 3*sgn*nx}" y1="${p1.y + 3*sgn*ny}" x2="${D1.x + 5*sgn*nx}" y2="${D1.y + 5*sgn*ny}" stroke="rgba(255,255,255,0.4)" stroke-width="1" />\n`;
              svgContent += `  <line x1="${p2.x + 3*sgn*nx}" y1="${p2.y + 3*sgn*ny}" x2="${D2.x + 5*sgn*nx}" y2="${D2.y + 5*sgn*ny}" stroke="rgba(255,255,255,0.4)" stroke-width="1" />\n`;

              if (isOutward) {
                svgContent += `  <line x1="${D1.x}" y1="${D1.y}" x2="${D2.x}" y2="${D2.y}" stroke="${color}" stroke-width="1.5" />\n`;
              } else {
                svgContent += `  <line x1="${D1.x - 16*ux}" y1="${D1.y - 16*uy}" x2="${D2.x + 16*ux}" y2="${D2.y + 16*uy}" stroke="${color}" stroke-width="1.5" />\n`;
              }

              const aLen = 9, aW = 3.6;
              const a1Angle = isOutward ? theta + Math.PI : theta;
              const a2Angle = isOutward ? theta : theta + Math.PI;
              const mkArr = (tx, ty, ang) => {
                const bx = tx - aLen * Math.cos(ang), by = ty - aLen * Math.sin(ang);
                const px = Math.cos(ang + Math.PI/2), py = Math.sin(ang + Math.PI/2);
                return `${tx.toFixed(1)},${ty.toFixed(1)} ${(bx + aW*px).toFixed(1)},${(by + aW*py).toFixed(1)} ${(bx - aW*px).toFixed(1)},${(by - aW*py).toFixed(1)}`;
              };
              svgContent += `  <polygon points="${mkArr(D1.x, D1.y, a1Angle)}" fill="${color}" />\n`;
              svgContent += `  <polygon points="${mkArr(D2.x, D2.y, a2Angle)}" fill="${color}" />\n`;

              const midX = (D1.x + D2.x) / 2, midY = (D1.y + D2.y) / 2;
              const valText = `${(L / scale).toFixed(1)} mm`;
              svgContent += `  <rect x="${midX - 25}" y="${midY - 8}" width="50" height="16" fill="#131317" stroke="${color}" stroke-width="1" rx="2" />\n`;
              svgContent += `  <text x="${midX}" y="${midY + 4}" fill="${color}" font-size="11" font-weight="bold" text-anchor="middle">${valText}</text>\n`;
            }
          } else {
            const dx = Math.abs(p2.x - p1.x), dy = Math.abs(p2.y - p1.y);
            svgContent += `  <line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p1.y}" stroke="#10b981" stroke-width="2" />\n`;
            svgContent += `  <line x1="${p2.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="#f43f5e" stroke-width="2" />\n`;
            svgContent += `  <text x="${(p1.x + p2.x)/2}" y="${p1.y - 6}" fill="#10b981" font-size="11" font-weight="bold" text-anchor="middle">Gap: ${(dx/scale).toFixed(1)}mm</text>\n`;
            svgContent += `  <text x="${p2.x + 8}" y="${(p1.y + p2.y)/2 + 4}" fill="#f43f5e" font-size="11" font-weight="bold">Flush: ${(dy/scale).toFixed(1)}mm</text>\n`;
          }
        }
      });

      svgContent += `</svg>`;

      const blob = new Blob([svgContent], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.download = `gap_flush_presentation_${Date.now()}.svg`;
      link.href = url;
      link.click();
      URL.revokeObjectURL(url);
    };

    resizeCanvas();
  </script>
</body>
</html>
